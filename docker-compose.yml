services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    ports:
      - "5173:3000"
    depends_on:
      - backend
    restart: unless-stopped
